<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디비전 자가점검</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout idea: one question per screen, big tap targets, result sheet at the end; ink on paper with a single signal yellow */
:root{
  --bg:#F3F4F2; --card:#FFFFFF; --ink:#141414; --muted:#5C6068; --line:#D9DBD6;
  --signal:#FFC800; --signal-ink:#141414; --soft:#FFF4C2; --warn:#8A4B00; --warn-bg:#FDEBD0;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121314; --card:#1C1E20; --ink:#F2F2EE; --muted:#A3A7AE; --line:#34373B;
    --signal:#FFC800; --signal-ink:#141414; --soft:#3A3310; --warn:#F2B66B; --warn-bg:#3A2A10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121314; --card:#1C1E20; --ink:#F2F2EE; --muted:#A3A7AE; --line:#34373B;
  --signal:#FFC800; --signal-ink:#141414; --soft:#3A3310; --warn:#F2B66B; --warn-bg:#3A2A10;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;line-height:1.3}
h1{font-size:24px}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:12px}
.btn-quiet{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;padding:10px 4px;cursor:pointer}
.btn-quiet:focus-visible,.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.meta{font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.bar > i{display:block;height:100%;background:var(--signal);width:0;transition:width .2s}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--ink);color:var(--bg);margin-bottom:12px}
.tag.train{background:var(--signal);color:var(--signal-ink)}
.q{font-size:22px;font-weight:700;line-height:1.45;text-wrap:balance;margin-bottom:8px}
.help{color:var(--muted);font-size:15px;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;min-height:58px;text-align:left;font:inherit;font-size:17px;font-weight:500;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt.on{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:16px}
.intro p{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border-radius:12px;border:0;background:var(--signal);color:var(--signal-ink);font:inherit;font-size:17px;font-weight:700;cursor:pointer;width:100%;margin-top:20px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;border:2px solid var(--line);color:var(--ink);font-weight:500}
.fine{font-size:14px;color:var(--muted)}
.sendjump{display:block;width:100%;text-align:left;font:inherit;background:var(--signal);color:var(--signal-ink);border:0;border-radius:14px;padding:14px 16px;margin-top:16px;cursor:pointer}
.sendjump b{display:block;font-size:17px}
.sendjump span{display:block;font-size:14px;margin-top:2px}
.sendjump:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sendsec{border:3px solid var(--signal);background:var(--soft);border-radius:16px;padding:20px 16px;margin-top:28px}
.sendsec .card{margin-top:14px}
.sendsec .btn{min-height:60px;font-size:19px;margin-top:14px}
.sendsec .tag{background:var(--signal);color:var(--signal-ink)}
.sendsec .fine{color:var(--ink)}
.sendstat.ok{font-weight:700;font-size:16px}
ul.plain{margin:10px 0 0;padding-left:20px}
ul.plain li{margin:6px 0}
.cand{border:2px solid var(--signal);border-radius:14px;padding:16px;background:var(--card);margin-top:12px}
.cand .rank{font-size:13px;font-weight:700;background:var(--signal);color:var(--signal-ink);display:inline-block;padding:1px 9px;border-radius:999px;margin-bottom:8px}
.cand.alt{border-color:var(--line)}
.cand.alt .rank{background:var(--line);color:var(--ink)}
dl.course{display:grid;grid-template-columns:7.5em 1fr;gap:6px 12px;margin:12px 0 0;font-size:15px}
dl.course dt{color:var(--muted)}
dl.course dd{margin:0}
details summary{cursor:pointer;font-weight:500;padding:6px 0}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:15px;margin-top:12px}
textarea{width:100%;min-height:150px;font:inherit;font-size:14px;line-height:1.5;border-radius:10px;border:1px solid var(--line);padding:10px;background:var(--bg);color:var(--ink);resize:vertical}
input[type=text]{width:100%;font:inherit;font-size:18px;border-radius:12px;border:2px solid var(--line);padding:14px;background:var(--card);color:var(--ink)}
label.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:15px}
label.check input{width:22px;height:22px;margin-top:2px;flex:none}
.sec{margin-top:28px}
.sec h2{margin-bottom:4px}
</style>
</head>

var TOTAL_HINT = {분류:0};

var ans = {}, hist = [], cur = "intro";

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    if (k === "class") e.className = attrs[k];
    else if (k === "text") e.textContent = attrs[k];
    else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}

function isSeated(){
  return (ans.type === "지체" && ans.ph_wc === "예") || (ans.type === "뇌병변" && ans.ce_wc === "예");
}

function next(from){
  var t = ans.type;
  switch(from){
    case "type":
      if (t === "시각") return "vi_detail";
      if (t === "청각") return "de_aid";
      if (t === "지체") return "ph_detail";
      if (t === "뇌병변") return "ce_detail";
      return "other_detail";
    case "vi_detail": return "vi_guide";
    case "other_detail": return "h_grade";
    case "ph_detail": return "ph_diag";
    case "ph_diag":
      if (ans.ph_detail === "척수손상" || ans.ph_detail === "이분척추") return "sci_level";
      if (ans.ph_detail === "절단") return "amp_site";
      return "ph_wc";
    case "sci_level": return ans.ph_detail === "척수손상" ? "sci_complete" : "ph_wc";
    case "sci_complete": return "ph_wc";
    case "amp_site":
      ans.ph_limb = (/팔/.test(ans.amp_site) && !/다리/.test(ans.amp_site)) ? "팔" : "다리";
      return "ph_wc";
    case "ce_detail": return "ce_wc";
    case "vi_guide": case "de_aid": return "t_run";
    case "ph_wc": return ans.ph_wc === "예" ? "hip" : ((ans.ph_detail === "절단" || ans.ph_detail === "저신장") ? "ph_crutch" : "ph_limb");
    case "ce_wc": return ans.ce_wc === "예" ? "hip" : "ce_crutch";
    case "hip": return "core";
    case "core": return "coord";
    case "coord": return "s_water";
    case "ph_limb": return "ph_crutch";
    case "ph_crutch": return "t_run";
    case "ph_short": return "t_run";
    case "ce_crutch": return "ce_limbs";
    case "ce_limbs": return "t_run";
    case "t_run": return t === "시각" ? "h_grade" : "t_squat";
    case "t_squat": return "t_lunge";
    case "t_lunge": return "t_carry10";
    case "t_carry10": return ans.t_carry10 === "못 해요" ? "t_farm" : "t_carry20";
    case "t_carry20": return "t_farm";
    case "t_farm": return "t_press";
    case "t_press": return (t === "지체" || t === "뇌병변") ? "s_grip" : "h_grade";
    case "s_water": return "s5";
    case "s5": return ans.s5 === "못 해요" ? "s_5min" : "s10";
    case "s10": return ans.s10 === "못 해요" ? "s_5min" : "s20";
    case "s20": return "s_5min";
    case "s_5min": return "s_1km";
    case "s_1km": return "s_grip";
    case "s_grip": return "s_armL";
    case "s_armL": return "s_armR";
    case "s_armR": return "h_grade";
    case "h_grade": return "h_pain";
    case "h_pain": return ans.h_pain === "없어요" ? "name" : "h_pain_where";
    case "h_pain_where": return "name";
    case "name": return "result";
  }
  return "result";
}

function classify(){
  var t = ans.type, list = [], notes = [], ask = [];
  function A(ko, en){ ask.push({ko:ko, en:en}); }
  if (t === "시각"){
    list = ["VI"];
    notes.push("시각 디비전은 약 50cm의 늘어나지 않는 테더가 필수예요. 가이드는 선수가 직접 정하고, HYROX가 제공하지 않아요.");
  } else if (t === "청각"){
    list = ["DH"];
    notes.push("청각 디비전의 기능 점수는 5.0이에요. 더블이 도입되면 두 선수의 점수 합이 7.0 이하여야 해요. 도입 시점은 확정되지 않았어요.");
  } else if (t === "그 외"){
    notes.push("룰북의 디비전 목록에 없는 유형이에요. 어느 디비전에 해당하는지 HYROX에 문의해 주세요.");
  } else if (isSeated()){
    var h = ans.hip, c = ans.core;
    if (h === "전혀" && c === "전혀") list = ["SWOC","SWOHF"];
    else if (h === "전혀" && c === "조금") list = ["SWOHF","SWOC"];
    else if (h === "전혀") list = ["SWOHF"];
    else if (h === "조금") list = (c === "전혀") ? ["SWHF","SWOHF","SWOC"] : ["SWHF","SWOHF"];
    else list = (c === "전혀") ? ["SWHF","SWOC"] : ["SWHF"];
    if (h === "조금"){
      notes.push("고관절 기능이 일부만 있는 경우, 룰북은 기능이 전체 또는 일부 있으면 '고관절 기능 있음'으로 봐요. 다만 어느 정도부터 기능으로 보는지 숫자 기준은 없어서, 경계에 있는 선수는 HYROX가 분류 과정에서 판단해요.");
      A("고관절 기능이 일부만 있는 경우 '고관절 기능 있음(SWHF)'과 '없음(SWOHF)' 중 어느 쪽으로 분류되나요?","If hip function is only partially present, is the racer placed in SWHF or SWOHF?");
    }
    if (t === "뇌병변" || ans.coord === "예" || (t === "지체" && h === "전혀")){
      list.push("NMAJ");
      notes.push("룰북의 Neurological Major 설명에는 휠체어로 이동하는 경우가 일반적이라고 나와 있고, 하반신 마비와 고위 뇌성마비가 예로 들어 있어요. 좌식 디비전과 겹칠 수 있어서 함께 확인이 필요해요.");
      A("휠체어를 쓰는 선수가 Neurological Major로 분류될 수 있나요?","Can a racer who uses a wheelchair be classified as Neuro Major?");
      A("Neurological Major로 분류되면 좌식 대체 동작(월볼 공을 무릎 위에 놓기, 버피 대신 휠체어 푸시 등)을 쓸 수 있나요? 룰북에는 좌식 디비전용으로만 적혀 있어요.","If classified as Neuro Major, may the seated adaptations (e.g., wall ball placed on the lap, wheelchair push in place of burpees) be used? The rulebook lists them for the seated divisions only.");
    }
  } else if (t === "지체"){
    if (ans.ph_short === "예" || ans.ph_detail === "저신장") list = ["SS"];
    else if (ans.ph_limb === "다리") list = (ans.ph_crutch === "늘 써요") ? ["LLMA","LLMI"] : ["LLMI","LLMA"];
    else if (ans.ph_limb === "팔"){
      list = ["ULMI","ULMA"];
      notes.push("Upper Limb Major는 팔 기능이 크게 제한된 경우예요. Upper Limb Major는 보조 스트랩이 허용되고 Upper Limb Minor는 허용되지 않아요.");
    } else {
      if (ans.ph_crutch === "늘 써요") list = ["LLMA","LLMI"];
      else if (ans.ph_crutch === "가끔 써요") list = ["LLMI","LLMA"];
      else notes.push("답하신 내용만으로는 후보를 좁히기 어려워요. HYROX에 문의해 주세요.");
    }
  } else if (t === "뇌병변"){
    var cr = ans.ce_crutch, lb = ans.ce_limbs;
    if (cr === "늘 써요") list = ["NMOD","NMAJ"];
    else if (cr === "가끔 써요") list = ["NMOD","NMIN"];
    else list = (lb === "1곳") ? ["NMIN"] : ["NMIN","NMOD"];
  }
  if (t === "그 외") A("제 장애가 어느 디비전에 해당하나요?","My impairment type is not clearly covered by the listed divisions. Which division would apply?");
  if (t === "시각") A("어댑티브 티켓 신청 때 가이드 정보를 어떻게 입력하고, 나중에 바꿀 수 있나요?","How do we enter the guide runner's information when registering for an Adaptive ticket, and can the guide be changed later?");
  A("공식 분류는 어떤 서류와 절차로 받나요? 티켓 구매 전, 또는 대회 현장에서 받을 수 있나요?","What documents and procedure are required for official classification for racers in Korea? Can it be done before ticket purchase, or at the event?");
  notes.push("이 결과는 후보예요. 룰북은 공식 분류를 받아야 출전할 수 있다고 하고, 최종 판단은 HYROX가 해요.");
  return {list:list, notes:notes, ask:ask};
}

function trainTips(){
  var tips = [];
  if (ans.t_run){
    if (ans.t_run === "못 해요") tips.push("1km는 걷기와 달리기를 섞어서 300~500m씩 늘려 가요.");
    if (ans.t_squat === "못 해요") tips.push("스쿼트는 의자에서 일어서기부터 시작해 보세요.");
    if (ans.t_lunge === "못 해요") tips.push("런지는 제자리 동작이나 지지대를 잡고 시작해 보세요.");
    if (ans.t_carry10 === "못 해요") tips.push("샌드백은 5kg부터 시작해 보세요.");
    else if (ans.t_carry10 && ans.t_carry20 === "못 해요") tips.push("샌드백 10kg까지 가능해요. 20kg은 천천히 늘려 가요.");
    else if (ans.t_carry20) tips.push("샌드백 20kg까지 가능해요.");
    if (ans.t_farm === "못 해요") tips.push("파머스 캐리는 가벼운 무게로 거리를 먼저 늘려 가요.");
    if (ans.t_press === "못 해요") tips.push("월볼 동작은 가벼운 공 던지기부터 시작해 보세요.");
  }
  if (ans.s_water === "못 해요") tips.push("월볼(2kg)은 가벼운 공 던지기부터 시작해 보세요.");
  else if (ans.s_water) tips.push("월볼 2kg 동작은 지금도 시도해 볼 수 있어요.");
  var s5 = ans.s5, s10 = ans.s10, s20 = ans.s20;
  if (s5 === "못 해요") tips.push("샌드백은 5kg도 아직 어려워요. 2~3kg부터 늘려 가요.");
  else if (s5 && (!s10 || s10 === "못 해요")) tips.push("샌드백은 5kg부터 시작해 보세요.");
  else if (s10 && (!s20 || s20 === "못 해요")) tips.push("샌드백은 10kg까지 가능해요. 20kg은 천천히 늘려 가요.");
  else if (s20) tips.push("샌드백 20kg까지 가능해요.");
  if (ans.s_5min === "못 해요") tips.push("지속 운동은 2~3분 단위로 나눠서 시작해 보세요.");
  if (ans.s_1km === "못 해요") tips.push("1km 이동은 300~500m씩 나눠서 늘려 가요.");
  if (ans.s_grip === "스트랩 필요") tips.push("스트랩이나 장갑이 필요해요. 대회 등록 때 장비로 신고해야 해요.");
  if (ans.s_armL === "못 해요" || ans.s_armR === "못 해요") tips.push("한쪽 팔 가동범위가 제한돼 있어요. 훈련 때 좌우 균형을 따로 봐요.");
  return tips;
}

function codeText(consentName){
  var r = classify();
  var parts = ["[어댑티브 디비전 자가점검]"];
  parts.push("이름: " + (ans.name || "(미입력)"));
  parts.push("등록 유형: " + ans.type);
  if (ans.type === "시각") parts.push("가이드: " + ans.vi_guide);
  if (ans.type === "청각") parts.push("보청기·인공와우 착용: " + ans.de_aid);
  if (ans.type === "지체"){
    parts.push("휠체어 주 이동: " + ans.ph_wc);
    if (ans.ph_wc === "아니요"){ if (ans.ph_limb) parts.push("절단·약화 부위: " + ans.ph_limb); parts.push("보장구: " + ans.ph_crutch); }
  }
  if (ans.type === "뇌병변"){
    parts.push("휠체어·보행기 주 이동: " + ans.ce_wc);
    if (ans.ce_wc === "아니요"){ parts.push("보장구: " + ans.ce_crutch); parts.push("마비·경직 팔다리: " + ans.ce_limbs); }
  }
  if (isSeated()){ parts.push("고관절 기능: " + ans.hip); parts.push("몸통(코어) 기능: " + ans.core); parts.push("경직·떨림: " + ans.coord); }
  parts.push("후보: " + (r.list.length ? r.list.map(function(k){return DIV[k].name + "(" + DIV[k].code + ")";}).join(" > ") : "없음, 문의 필요"));
  if (ans.t_run){
    parts.push("체력(서서): 1km " + ans.t_run + (ans.t_squat ? ", 스쿼트 " + ans.t_squat + ", 런지 " + ans.t_lunge + ", 10kg " + (ans.t_carry10 || "-") + ", 20kg " + (ans.t_carry20 || "-") + ", 양손 캐리 " + ans.t_farm + ", 머리 위 밀기 " + ans.t_press : ""));
    if (ans.s_grip) parts.push("쥐기 " + ans.s_grip + ", 왼팔 " + (ans.s_armL || "-") + ", 오른팔 " + (ans.s_armR || "-"));
  }
  if (ans.s_water){
    parts.push("체력: 생수 " + ans.s_water + ", 5kg " + (ans.s5 || "-") + ", 10kg " + (ans.s10 || "-") + ", 20kg " + (ans.s20 || "-") + ", 5분 " + ans.s_5min + ", 1km " + ans.s_1km + ", 쥐기 " + ans.s_grip + ", 왼팔 " + ans.s_armL + ", 오른팔 " + ans.s_armR);
  }
  return parts.join(" | ");
}

var MAIL_TO = "adaptives@hyrox.com";
var D_EN = {"척수손상":"Spinal cord injury","이분척추":"Spina bifida","절단":"Amputation","소아마비":"Polio (post-polio)","신경근육질환":"Neuromuscular condition","관절장애":"Joint impairment","저신장":"Short stature","그 외":"Other","뇌성마비":"Cerebral palsy","뇌졸중":"Stroke","외상성 뇌손상":"Traumatic brain injury","전맹":"Blind (no or light perception only)","저시력":"Low vision","모름":"Not sure"};
var AMP_EN = {"한쪽 다리, 무릎 아래":"one leg, below knee","한쪽 다리, 무릎 위":"one leg, above knee","양쪽 다리":"both legs","한쪽 팔":"one arm","양쪽 팔":"both arms","팔과 다리 모두":"arms and legs"};
var T_EN = {"지체":"Physical (limb / spinal)","뇌병변":"Brain lesion (e.g., cerebral palsy)","시각":"Visual","청각":"Hearing","그 외":"Other"};
var L_EN = {"쓸 수 있어요":"usable","가능해요":"yes","조금":"partial","전혀":"none","예":"yes","아니요":"no","늘 써요":"always","가끔 써요":"sometimes","쓰지 않아요":"no","다리":"legs","팔":"arms","없어요":"none","1곳":"1 limb","2곳 이상":"2 or more limbs","완전 손상":"complete","불완전 손상":"incomplete","잘 모르겠어요":"not sure"};
function en(v){ return L_EN[v] || v; }

function mailSubject(){
  return "Adaptive division inquiry - HYROX Incheon (May 2027)" + (ans.name ? " - " + ans.name : "");
}
function mailBody(){
  var r = classify(), L = [];
  L.push("Hello HYROX Adaptive team,");
  L.push("");
  L.push("I am planning to race HYROX Adaptive at HYROX Incheon (May 2027) and would like to confirm my division before registering.");
  L.push("");
  L.push("Name: " + (ans.name || "[your name]"));
  L.push("Disability type on my Korean disability registration card: " + (T_EN[ans.type] || ans.type));
  var det = ans.ph_detail || ans.ce_detail || ans.vi_detail;
  if (det) L.push("Specific condition: " + (D_EN[det] || det) + (ans.ph_detail === "그 외" && ans.ph_diag ? " (" + ans.ph_diag + ")" : ""));
  if (ans.other_detail) L.push("Details: " + ans.other_detail);
  if (ans.sci_level) L.push("Level: " + ans.sci_level);
  if (ans.sci_complete) L.push("Complete / incomplete: " + en(ans.sci_complete));
  if (ans.amp_site) L.push("Amputation site: " + (AMP_EN[ans.amp_site] || ans.amp_site));
  if (ans.type === "시각") L.push("Guide runner: " + en(ans.vi_guide));
  if (ans.type === "청각") L.push("Hearing aid / cochlear implant during the race: " + en(ans.de_aid));
  if (ans.type === "지체"){
    L.push("Wheelchair as main mobility: " + en(ans.ph_wc));
    if (ans.ph_wc === "아니요"){ if (ans.ph_limb) L.push("Limbs affected: " + en(ans.ph_limb)); L.push("Crutches / braces: " + en(ans.ph_crutch)); }
  }
  if (ans.type === "뇌병변"){
    L.push("Wheelchair / walker as main mobility: " + en(ans.ce_wc));
    if (ans.ce_wc === "아니요"){ L.push("Crutches / braces: " + en(ans.ce_crutch)); L.push("Limbs affected: " + en(ans.ce_limbs)); }
  }
  if (isSeated()){
    L.push("Hip function when seated: " + en(ans.hip));
    L.push("Trunk (core) control when seated: " + en(ans.core));
    L.push("Involuntary movement, tremor or stiffness: " + en(ans.coord));
  }
  L.push("");
  L.push("Divisions I think may apply (self-check, not official): " + (r.list.length ? r.list.map(function(k){ return DIV[k].code; }).join(", ") : "not sure"));
  L.push("");
  L.push("Questions:");
  r.ask.forEach(function(a, i){ L.push((i + 1) + ". " + a.en); });
  L.push("");
  L.push("Thank you very much for your help.");
  L.push(ans.name || "[your name]");
  return L.join("\n");
}

function newId(){ return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
var submitId = newId();
function buildRecord(){
  var r = classify(), rec = {};
  rec["이름"] = ans.name || "";
  Object.keys(LABEL).forEach(function(k){ if (ans[k] != null && ans[k] !== "") rec[LABEL[k]] = ans[k]; });
  rec["후보 디비전"] = r.list.map(function(k){ return DIV[k].code; }).join(", ");
  return rec;
}
function sendRecord(statusEl, btn, nameInput){
  if (nameInput){ ans.name = nameInput.value.trim(); }
  if (!ans.name){ statusEl.textContent = "이름을 적어 주세요. 이름이 없으면 운영진이 누구인지 알 수 없어요."; return; }
  btn.setAttribute("disabled", "disabled");
  statusEl.textContent = "보내는 중이에요...";
  var body = JSON.stringify({id:submitId, record:buildRecord()});
  var done = false;
  fetch(SEND_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:body})
    .then(function(res){ return res.json(); })
    .then(function(j){
      if (j && j.ok){ done = true; statusEl.className = "fine sendstat ok"; statusEl.textContent = "✓ 보냈어요. 운영진이 확인할게요."; }
      else { statusEl.textContent = "전송에 문제가 있었어요. 잠시 뒤 다시 눌러 주세요."; btn.removeAttribute("disabled"); }
    })
    .catch(function(){
      if (!done){ statusEl.textContent = "전송하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요."; btn.removeAttribute("disabled"); }
    });
}

var app = document.getElementById("app");

function topbar(){
  var back = el("button", {class:"btn-quiet", type:"button", text:"← 이전", onclick:goBack});
  if (!hist.length) back.style.visibility = "hidden";
  var reset = el("button", {class:"btn-quiet", type:"button", text:"처음부터", onclick:restart});
  return el("div", {class:"topbar"}, [back, reset]);
}

function render(){
  app.textContent = "";
  window.scrollTo(0, 0);
  if (cur === "intro") return renderIntro();
  if (cur === "result") return renderResult();
  if (STEPS[cur] && STEPS[cur].input === "text") return renderText(cur);
  var s = STEPS[cur];
  var n = hist.length + 1;
  var prog = el("div", {class:"bar", role:"presentation"}, [el("i", {style:"width:" + Math.min(95, n * 4) + "%"})]);
  var tag = el("span", {class:"tag" + (s.tag === "체력" ? " train" : ""), text: s.tag === "체력" ? "체력 질문 · 훈련 참고용" : (s.tag === "건강" ? "건강 질문 · 안전 준비용" : "분류 질문")});
  var qtext = (s.qx && s.qx[ans.type]) || s.q;
  var opts = el("div", {class:"opts", role:"group", "aria-label":qtext});
  s.opts.forEach(function(label, i){
    var val = s.vals ? s.vals[i] : label;
    var b = el("button", {class:"opt" + (ans[cur] === val ? " on" : ""), type:"button", text:label, onclick:function(){ choose(val); }});
    opts.appendChild(b);
  });
  app.appendChild(topbar());
  app.appendChild(el("div", {class:"meta", text:n + "번째 질문"}));
  app.appendChild(prog);
  app.appendChild(tag);
  app.appendChild(el("h2", {class:"q", text:qtext}));
  if (s.help) app.appendChild(el("p", {class:"help", text:s.help}));
  app.appendChild(opts);
}

function choose(val){
  ans[cur] = val;
  hist.push(cur);
  cur = next(cur);
  render();
}

function goBack(){
  if (!hist.length) return;
  cur = hist.pop();
  render();
}

function restart(){
  ans = {}; hist = []; cur = "intro"; render();
}

function renderIntro(){
  var card = el("div", {class:"intro"}, [
    el("span", {class:"tag", text:"애슬래트로피"}),
    el("h1", {text:"어댑티브 디비전 자가점검"}),
    el("p", {text:"복지카드의 장애 유형에서 시작해서, 몇 가지 질문에 답하면 HYROX 어댑티브에서 문의해 볼 후보 디비전과 코스 무게를 알려 줘요."}),
    el("div", {class:"card"}, [
      el("h3", {text:"시작 전에 읽어 주세요"}),
      el("ul", {class:"plain"}, [
        el("li", {text:"공식 분류가 아니에요. 최종 분류는 HYROX가 해요."}),
        el("li", {text:"장애 정도와 통증을 물어요. 지체장애는 진단명과 손상 부위도 물어요. 훈련과 대회 당일 안전 준비에 필요해요. 모르는 칸은 비워 둬도 돼요."}),
        el("li", {text:"장애·건강 정보는 애슬래트로피가 가이드 매칭, 선발 참고, 프로그램 구성과 참가 인원 논의, 훈련, 대회 당일 안전 준비에만 써요. 시작하면 이 목적의 제공에 동의한 것으로 봐요."}),
        el("li", {text:"약 5분 걸려요."})
      ])
    ]),
    el("button", {class:"btn", type:"button", text:"시작하기", onclick:function(){ cur = "type"; render(); }})
  ]);
  app.appendChild(card);
}

function renderText(id){
  var s = STEPS[id];
  var inp = el("input", {type:"text", "aria-label":s.q});
  if (id === "name") inp.setAttribute("autocomplete", "name");
  inp.value = ans[id] || "";
  app.appendChild(topbar());
  app.appendChild(el("div", {class:"meta", text:(hist.length + 1) + "번째 질문"}));
  app.appendChild(el("div", {class:"bar"}, [el("i", {style:"width:" + Math.min(95, (hist.length + 1) * 4) + "%"})]));
  app.appendChild(el("span", {class:"tag", text: s.tag === "건강" ? "건강 질문 · 안전 준비용" : (s.tag === "마무리" ? "마무리" : "분류 질문")}));
  app.appendChild(el("h2", {class:"q", text:s.q}));
  if (s.help) app.appendChild(el("p", {class:"help", text:s.help}));
  app.appendChild(inp);
  app.appendChild(el("button", {class:"btn", type:"button", text: id === "name" ? "결과 보기" : "다음", onclick:function(){
    ans[id] = inp.value.trim();
    hist.push(id); cur = next(id); render();
  }}));
}

function courseBlock(k){
  var d = DIV[k];
  var dl = el("dl", {class:"course"});
  COURSE_ROWS.forEach(function(r){
    dl.appendChild(el("dt", {text:r[1]}));
    dl.appendChild(el("dd", {text:d[r[0]]}));
  });
  return dl;
}

function renderResult(){
  var r = classify();
  app.appendChild(topbar());
  app.appendChild(el("h1", {text:"문의해 볼 후보 디비전"}));
  app.appendChild(el("p", {class:"help", style:"margin-top:6px", text: SEND_URL ? "아래 결과는 후보예요. 최종 분류는 HYROX가 해요." : "아래 결과는 후보예요. 맨 아래 문의 메일 초안을 HYROX 어댑티브팀에 보내 확인해 보세요."}));
  if (SEND_URL){
    app.appendChild(el("button", {class:"sendjump", type:"button", onclick:function(){
      var t = document.getElementById("sendsec"); if (t) t.scrollIntoView({behavior:"smooth", block:"start"});
    }}, [el("b", {text:"결과를 운영진에게 꼭 보내 주세요"}), el("span", {text:"맨 아래 '운영진에게 보내기'를 눌러야 가이드 매칭, 선발, 프로그램 구성에 반영할 수 있어요. 누르면 바로 이동해요."})]));
  }

  if (!r.list.length){
    app.appendChild(el("div", {class:"note", text:"후보를 좁히지 못했어요. 룰북의 디비전 목록은 하지·상지·저신장·시각·청각·신경계·좌식이에요. HYROX에 직접 문의해 주세요."}));
  }
  r.list.forEach(function(k, i){
    var d = DIV[k];
    var box = el("div", {class:"cand" + (i ? " alt" : "")}, [
      el("span", {class:"rank", text: i === 0 ? "1순위 후보" : (i + 1) + "순위 · 함께 확인"}),
      el("h2", {text:d.name}),
      el("p", {class:"fine", text:"코드 " + d.code + " · 기능 점수 " + d.pt})
    ]);
    if (i === 0) box.appendChild(courseBlock(k));
    else {
      var det = el("details", null, [el("summary", {text:"이 디비전의 코스 보기"}), courseBlock(k)]);
      box.appendChild(det);
    }
    app.appendChild(box);
  });

  r.notes.forEach(function(n){ app.appendChild(el("div", {class:"note", text:n})); });

  var tips = trainTips();
  if (tips.length){
    var tsec = el("div", {class:"sec"}, [el("h2", {text:"훈련 참고"}), el("p", {class:"fine", text:"설문 응답으로 본 대략적인 출발점이에요. 분류와는 관계없고, 12~2월 기초체력 측정에서 실제로 확인해요."})]);
    var ul = el("ul", {class:"plain"});
    tips.forEach(function(t){ ul.appendChild(el("li", {text:t})); });
    tsec.appendChild(ul);
    app.appendChild(tsec);
  }

  var asec = el("div", {class:"sec"}, [el("h2", {text:"HYROX에 확인할 질문"})]);
  var aul = el("ul", {class:"plain"});
  r.ask.forEach(function(a){ aul.appendChild(el("li", {text:a.ko})); });
  asec.appendChild(aul);
  app.appendChild(asec);

  if (SEND_URL){
    var nameIn = ans.name ? null : el("input", {type:"text", "aria-label":"이름", placeholder:"이름", style:"margin-top:12px"});
    var sstat = el("p", {class:"fine sendstat", style:"margin-top:8px"});
    var sbtn = el("button", {class:"btn", type:"button", text:"운영진에게 보내기"});
    sbtn.addEventListener("click", function(){ sendRecord(sstat, sbtn, nameIn); });
    var ssec = el("div", {class:"sendsec", id:"sendsec"}, [
      el("span", {class:"tag", text:"먼저 해 주세요"}),
      el("h2", {text:"애슬래트로피 운영진에게 보내기"}),
      el("p", {class:"fine", text:"보내면 아래 내용이 애슬래트로피 운영진(백신애, 전병준)에게만 전달돼요. 가이드 매칭, 선발 참고, 프로그램 구성과 참가 인원 논의, 훈련, 대회 당일 안전 준비에만 써요."}),
      el("ul", {class:"plain"}, [
        el("li", {text:"이름, 장애 유형과 세부 유형, 진단명, 손상 수준, 장애 정도, 통증"}),
        el("li", {text:"기능 질문과 체력 질문에 고른 답, 후보 디비전"})
      ]),
      el("div", {class:"card"}, [nameIn, sbtn, sstat])
    ]);
    app.appendChild(ssec);
  }

  var ta = el("textarea", {id:"mailbody", "aria-label":"메일 본문", style:"min-height:260px"});
  ta.value = mailBody();
  var link = el("a", {class:"btn", target:"_blank", rel:"noopener", style:"text-decoration:none", text:"메일 앱으로 열기"});
  function setHref(){ link.setAttribute("href", "mailto:" + MAIL_TO + "?subject=" + encodeURIComponent(mailSubject()) + "&body=" + encodeURIComponent(ta.value)); }
  setHref();
  ta.addEventListener("input", setHref);
  var mstat = el("p", {class:"fine", style:"margin-top:8px"});
  var mcopy = el("button", {class:"btn ghost", type:"button", text:"내용 복사", onclick:function(){
    var text = "To: " + MAIL_TO + "\nSubject: " + mailSubject() + "\n\n" + ta.value;
    var done = function(ok){ mstat.textContent = ok ? "복사했어요. 메일 앱에 붙여넣어 보내세요." : "복사가 안 되면 위 글자를 길게 눌러 직접 복사해 주세요."; };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallbackCopy(ta, done); });
      else fallbackCopy(ta, done);
    } catch(e){ fallbackCopy(ta, done); }
  }});
  var msec = el("div", {class:"sec"}, [
    el("h2", {text:"HYROX 어댑티브팀에 문의 메일 보내기"}),
    el("p", {class:"fine", text:"받는 사람은 " + MAIL_TO + "예요. 아래는 영어 초안이고, 필요하면 고쳐서 보내세요. 메일은 직접 보내는 것이라 보내기 전에는 아무 데도 전달되지 않아요."}),
    el("div", {class:"card"}, [ta, link, mcopy, mstat])
  ]);
  app.appendChild(msec);


  app.appendChild(el("button", {class:"btn ghost", type:"button", text:"처음부터 다시 하기", onclick:restart}));
}

function fallbackCopy(ta, done){
  try {
    ta.removeAttribute("readonly"); ta.focus(); ta.select();
    var ok = document.execCommand && document.execCommand("copy");
    ta.setAttribute("readonly", "readonly");
    done(!!ok);
  } catch(e){ done(false); }
}

render();
})();
</script>
</body>
</html>
